name: Jiggypuff
options:
  bundleIdPrefix: com.jiggypuff
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    AD_HOC_CODE_SIGNING_ALLOWED: YES

targets:
  Jiggypuff:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Jiggypuff
      - path: Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Jiggypuff.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.jiggypuff.app
        PRODUCT_NAME: Jiggypuff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: AVFoundation.framework
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - sdk: Security.framework
